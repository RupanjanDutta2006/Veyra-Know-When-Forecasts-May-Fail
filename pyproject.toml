[project]
name = "veyra"
version = "0.1.0"
description = "Veyra — Know When Forecasts May Fail (Atmospheric Forecast Reliability Platform)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "joblib>=1.3.0",
    "lightgbm>=4.0.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.vercel.scripts]
build = "cd frontend && npm install && npm run build"
